# Builds DevDeck for every platform and attaches the downloads to a GitHub release.
#
# Runs when a version tag is pushed (git tag v3.0.0 && git push origin v3.0.0), or by hand from
# the Actions tab. Each platform is built on its own OS, so the macOS launcher is signed by
# macOS itself and the macOS/Linux archives keep their executable bit - a zip made on Windows
# would lose both.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v3.0.0-alpha.1 (created if missing)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64'
        run: dotnet test tests/DevDeck.Core.Tests -c Release

      - name: Publish
        run: dotnet publish src/DevDeck.App -c Release -r ${{ matrix.rid }} --self-contained -o out/DevDeck

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/DevDeck -DestinationPath DevDeck-${{ matrix.rid }}.zip

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          chmod +x out/DevDeck/DevDeck
          tar -czf DevDeck-${{ matrix.rid }}.tar.gz -C out DevDeck

      - uses: actions/upload-artifact@v4
        with:
          name: DevDeck-${{ matrix.rid }}
          path: DevDeck-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Not marked pre-release, on purpose: GitHub's /releases/latest/download/... links, which the
      # README uses, skip pre-releases, and would then point at nothing.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DevDeck ${{ github.event.inputs.tag || github.ref_name }}
          make_latest: 'true'
          generate_release_notes: true
          files: dist/*
